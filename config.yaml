app:
  # Date format to use | type=str
  date_format: '%Y-%m-%d'
  # Logging level for the application | type=str | choices=['DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL']
  log_level: INFO
  # Maximum log file size in MB before rotation | type=int
  log_file_max_size: 2
  # Enable logging to file | type=bool | choices=[True, False]
  enable_file_logging: true
  # Enable logging to console | type=bool | choices=[True, False]
  enable_console_logging: true
  # GUI theme setting supported by ttkbootstrap | type=str | choices=['cosmo', 'flatly', 'litera', 'minty', 'lumen', 'sandstone', 'yeti', 'pulse', 'united', 'darkly', 'superhero', 'solar', 'cyborg', 'vapor', 'simplex']
  theme: darkly
cli:
  # One or more input paths (GPX, KML, ZIP, or directory) | type=str | [CLI]
  input: ''
  # Output directory; 'auto' creates a timestamped directory | type=str | [CLI]
  output: auto
  # Douglas-Peucker simplification tolerance in meters | type=float | [CLI]
  tolerance: 10.0
  # Processing operation | type=str | [CLI] | choices=['compress', 'merge', 'extract-pois']
  mode: compress
  # Search input directories recursively | type=bool | [CLI] | choices=[True, False]
  recursive: false
  # Include elevation data in waypoints | type=bool | [CLI] | choices=[True, False]
  elevation: true
gui:
  # GUI theme setting | type=str | choices=['light', 'dark', 'auto']
  theme: light
  # Default window width | type=int
  window_width: 800
  # Default window height | type=int
  window_height: 600
  # Height of the log window in pixels | type=int
  log_window_height: 200
  # Automatically scroll to newest log entries | type=bool | choices=[True, False]
  auto_scroll_log: true
  # Maximum number of log lines to keep in GUI | type=int
  max_log_lines: 1000
